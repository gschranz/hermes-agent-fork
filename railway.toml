[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/app/start.sh"
healthcheckPath = "/health"
healthcheckTimeout = 300
# "always" statt "on_failure": restart-service.sh fährt PID 1 graceful runter
# (Exit-Code 0) -> bei on_failure würde Railway NICHT neu starten.
restartPolicyType = "always"
